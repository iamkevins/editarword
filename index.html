<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Editor Word Pro</title>

  <!-- Carlito: réplica métrica exacta de la tipografía Calibri de Microsoft Word -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <!-- Motores para leer y editar Word nativo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  <!-- Conversor final opcional a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="stylesheet" href="./style.css?v=40">
</head>
<body>

  <!-- Barra superior -->
  <header class="top-nav">
    <div class="history-controls">
      <button id="btn-undo" class="nav-btn" disabled title="Deshacer (Ctrl+Z)">
        <span class="icon">↶</span>
      </button>
      <button id="btn-redo" class="nav-btn" disabled title="Rehacer (Ctrl+Y)">
        <span class="icon">↷</span>
      </button>

      <!-- Selector de páginas (1 / 2) -->
      <button id="btn-prev-page" class="nav-btn page-arrow" style="display: none;" title="Anterior">◀</button>
      <button id="btn-page-selector" class="nav-btn page-num-btn" style="display: none;" title="Cambiar página">
        <span id="page-indicator">1 / 1</span>
        <span class="arrow-down">▼</span>
      </button>
      <button id="btn-next-page" class="nav-btn page-arrow" style="display: none;" title="Siguiente">▶</button>
    </div>
    
    <div class="status-container">
      <span id="status-badge" class="status-badge">Sin documento</span>
    </div>
  </header>

  <!-- Espacio de trabajo infinito -->
  <main id="viewport">
    <div id="empty-state">
      <div style="font-size: 48px; margin-bottom: 8px;">📝</div>
      <div style="font-size: 18px; font-weight: 700; color: #f8fafc;">Ningún archivo Word abierto</div>
      <div style="font-size: 14px; color: #94a3b8; margin-top: 6px;">Toca en <b>"Herramientas"</b> para abrir tu archivo <b>.docx</b></div>
    </div>

    <div id="sheet-wrapper">
      <div id="grid-overlay" class="grid-overlay"></div>
      <!-- Documento Word nativo 100% editable -->
      <div id="doc-content" class="doc-content"></div>
    </div>
  </main>

  <!-- Modal selector numérico de hojas -->
  <div id="page-modal-backdrop" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Seleccionar página</span>
        <button id="close-page-modal" class="btn-icon">✕</button>
      </div>
      <div id="page-buttons-grid" class="page-grid"></div>
    </div>
  </div>

  <!-- Botón flotante -->
  <button class="fab-main-trigger" id="open-tools-btn">
    <span>🛠️</span>
    <span>Herramientas</span>
  </button>

  <!-- Menú de herramientas -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="tools-panel">
      <div class="panel-header">
        <span class="panel-title">Opciones de Word</span>
        <button class="panel-close" id="close-tools-btn">✕</button>
      </div>

      <div class="tools-grid">
        <label class="tool-btn highlight" for="doc-input" style="cursor:pointer;">
          <span class="icon">📁</span>
          <span>Abrir Word (.docx)</span>
        </label>
        <input type="file" id="doc-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;">

        <button class="tool-btn disabled-tool" id="btn-toggle-grid">
          <span class="icon">⊞</span>
          <span>Grilla Guía</span>
        </button>

        <button class="tool-btn disabled-tool" id="btn-reset-zoom">
          <span class="icon">🎯</span>
          <span>Centrar Hoja</span>
        </button>

        <!-- Conversión a PDF solo al terminar todo el trabajo -->
        <button class="tool-btn success disabled-tool" id="btn-save-pdf">
          <span class="icon">📄</span>
          <span>Exportar a PDF</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=40"></script>
</body>
</html>

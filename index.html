<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Editor Word Pro - Fidelidad y Edición Directa</title>

  <!-- Fuentes tipográficas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&family=Lato:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@500&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600;700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&family=Rubik:wght@400;600&display=swap" rel="stylesheet">

  <!-- Librerías de renderizado y PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.9/dist/pdf-lib.min.js"></script>
  <script>
    if (!window.PDFLib && !window.pdfLib) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"><\/script>');
    }
  </script>

  <link rel="stylesheet" href="./style.css?v=25">
</head>
<body>

  <!-- Barra de control superior -->
  <header class="top-nav">
    <div class="history-controls">
      <!-- Deshacer y Rehacer funcionales -->
      <button id="btn-undo" class="nav-btn" disabled title="Deshacer (Ctrl+Z)">
        <span class="icon">↶</span>
      </button>
      <button id="btn-redo" class="nav-btn" disabled title="Rehacer (Ctrl+Y)">
        <span class="icon">↷</span>
      </button>

      <!-- Selector numérico directo (ej: 1 / 2) -->
      <button id="btn-prev-page" class="nav-btn page-arrow" style="display: none;" title="Anterior">◀</button>
      <button id="btn-page-selector" class="nav-btn page-num-btn" style="display: none;" title="Cambiar página">
        <span id="page-indicator">1 / 1</span>
        <span class="arrow-down">▼</span>
      </button>
      <button id="btn-next-page" class="nav-btn page-arrow" style="display: none;" title="Siguiente">▶</button>
    </div>
    
    <div class="status-container">
      <span id="status-badge" class="status-badge">Sin documento</span>
    </div>
  </header>

  <!-- Espacio de trabajo infinito -->
  <main id="viewport">
    <div id="empty-state">
      <div style="font-size: 48px; margin-bottom: 8px;">📝</div>
      <div style="font-size: 18px; font-weight: 700; color: #f8fafc;">Ningún archivo Word abierto</div>
      <div style="font-size: 14px; color: #94a3b8; margin-top: 6px;">Toca en <b>"Herramientas"</b> para abrir tu archivo <b>.docx</b></div>
    </div>

    <div id="sheet-wrapper">
      <canvas id="pdf-canvas"></canvas>
      <div id="grid-overlay" class="grid-overlay"></div>
      <!-- Capa de texto editable directa en el documento -->
      <div id="text-detect-layer" class="text-detect-layer"></div>
      <div class="fabric-wrapper">
        <canvas id="fabric-canvas"></canvas>
      </div>
    </div>
  </main>

  <!-- MODAL SELECTOR DIRECTO DE PÁGINAS -->
  <div id="page-modal-backdrop" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Seleccionar página</span>
        <button id="close-page-modal" class="btn-icon">✕</button>
      </div>
      <div id="page-buttons-grid" class="page-grid"></div>
    </div>
  </div>

  <!-- CRUCETA (D-PAD) Y GRILLA -->
  <div id="precision-tools" class="precision-tools">
    <button id="btn-toggle-grid" class="grid-toggle-btn" title="Mostrar/Ocultar Grilla">
      <span class="grid-icon">⊞</span>
      <span class="grid-text">Grilla</span>
    </button>

    <div class="dpad-cross">
      <button class="dpad-btn up" id="dpad-up">▲</button>
      <button class="dpad-btn left" id="dpad-left">◀</button>
      <div class="dpad-center">1px</div>
      <button class="dpad-btn right" id="dpad-right">▶</button>
      <button class="dpad-btn down" id="dpad-down">▼</button>
    </div>
  </div>

  <!-- Botón flotante -->
  <button class="fab-main-trigger" id="open-tools-btn">
    <span>🛠️</span>
    <span>Herramientas</span>
  </button>

  <!-- Panel desplegable -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="tools-panel">
      <div class="panel-header">
        <span class="panel-title">Opciones de Edición</span>
        <button class="panel-close" id="close-tools-btn">✕</button>
      </div>

      <div class="tools-grid">
        <button class="tool-btn highlight disabled-tool" id="btn-mode-edit-text">
          <span class="icon">✏️</span>
          <span>Escribir en Texto</span>
        </button>

        <button class="tool-btn disabled-tool" id="btn-whiteout">
          <span class="icon">⬜</span>
          <span>Tapar / Parche</span>
        </button>

        <button class="tool-btn disabled-tool" id="btn-draw">
          <span class="icon">🖊️</span>
          <span>Firmar / Lápiz</span>
        </button>

        <label class="tool-btn disabled-tool" for="img-input" style="cursor:pointer;">
          <span class="icon">🖼️</span>
          <span>Subir Foto/Firma</span>
        </label>
        <input type="file" id="img-input" accept="image/png, image/jpeg" style="display:none;">

        <!-- Solo acepta archivos Word (.docx) -->
        <label class="tool-btn" for="doc-input" style="cursor:pointer;">
          <span class="icon">📁</span>
          <span>Abrir Word (.docx)</span>
        </label>
        <input type="file" id="doc-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;">

        <button class="tool-btn disabled-tool" id="btn-delete-layer">
          <span class="icon">🗑️</span>
          <span>Eliminar Capa</span>
        </button>

        <button class="tool-btn disabled-tool" id="btn-reset-zoom">
          <span class="icon">🎯</span>
          <span>Centrar Vista</span>
        </button>

        <!-- Exportar a PDF con fidelidad exacta -->
        <button class="tool-btn success disabled-tool" id="btn-save">
          <span class="icon">💾</span>
          <span>Exportar a PDF</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=25"></script>
</body>
</html>

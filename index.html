<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor Word Pro - Motor Syncfusion</title>

  <!-- Estilos del tema Material de Syncfusion -->
  <link href="https://cdn.syncfusion.com/ej2/26.1.35/material.css" rel="stylesheet" />

  <!-- Motor completo de Syncfusion EJ2 -->
  <script src="https://cdn.syncfusion.com/ej2/26.1.35/dist/ej2.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior personalizada */
    .app-header {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 100;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      background: #2563eb;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: #1d4ed8;
    }

    .btn-action.pdf {
      background: #dc2626;
    }

    .btn-action.pdf:hover {
      background: #b91c1c;
    }

    /* Contenedor principal del editor */
    #document-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 53px);
      position: relative;
    }

    /* Ajuste responsivo de la barra de Syncfusion */
    .e-de-ctn {
      border: none !important;
    }
  </style>
</head>
<body>

  <!-- Barra de control superior con descarga directa -->
  <header class="app-header">
    <div class="app-title">
      <span>📝</span>
      <span>Editor Word & Convertidor</span>
    </div>

    <div class="header-actions">
      <!-- Botón de apertura manual de archivo .docx -->
      <label class="btn-action" for="file-upload" style="cursor: pointer;">
        <span>📁</span>
        <span>Abrir Word</span>
      </label>
      <input type="file" id="file-upload" accept=".docx,.doc,.rtf,.txt" style="display: none;" />

      <!-- Botón de exportación a PDF -->
      <button id="btn-export-pdf" class="btn-action pdf">
        <span>📄</span>
        <span>Exportar a PDF</span>
      </button>

      <!-- Botón de guardado en Word -->
      <button id="btn-save-docx" class="btn-action">
        <span>💾</span>
        <span>Guardar .docx</span>
      </button>
    </div>
  </header>

  <!-- Área donde se renderiza el lienzo idéntico a Word -->
  <div id="document-container"></div>

  <script>
    // Inicializar el contenedor de Syncfusion Document Editor
    const container = new ej.documenteditor.DocumentEditorContainer({
      enableToolbar: true,
      height: '100%',
      // Servicio web oficial que procesa y traduce las estructuras binarias del .docx a vectores
      serviceUrl: 'https://document.syncfusion.com/web-services/docx-editor/api/documenteditor/'
    });

    // Inyectar el módulo de barra de herramientas completa
    ej.documenteditor.DocumentEditorContainer.Inject(ej.documenteditor.Toolbar);

    // Montar en el elemento HTML
    container.appendTo('#document-container');

    // Manejar apertura de archivos Word (.docx)
    const fileUpload = document.getElementById('file-upload');
    fileUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const format = file.name.substring(file.name.lastIndexOf('.'));
      
      // Si el usuario sube un archivo Word (.docx, .doc, etc.)
      if (format === '.docx' || format === '.doc' || format === '.rtf' || format === '.txt') {
        const formData = new FormData();
        formData.append('files', file);

        // Llamada al motor de importación para obtener el árbol vectorial del archivo
        fetch('https://document.syncfusion.com/web-services/docx-editor/api/documenteditor/Import', {
          method: 'POST',
          body: formData
        })
        .then(response => {
          if (!response.ok) throw new Error('Error al procesar el archivo en el servidor.');
          return response.text();
        })
        .then(sfdtData => {
          // Abre el documento respetando exactamente las hojas, márgenes y tablas
          container.documentEditor.open(sfdtData);
          container.documentEditor.documentName = file.name.replace(/\.[^/.]+$/, "");
        })
        .catch(err => {
          console.error(err);
          alert('Hubo un problema al cargar el archivo Word: ' + err.message);
        });
      }
    });

    // Guardar como archivo Word (.docx)
    document.getElementById('btn-save-docx').addEventListener('click', () => {
      const docName = container.documentEditor.documentName || 'Documento';
      container.documentEditor.save(docName, 'Docx');
    });

    // Exportar / Convertir directamente a PDF
    document.getElementById('btn-export-pdf').addEventListener('click', () => {
      // Abre el diálogo de impresión optimizado con las hojas vectoriales exactas
      // Permite elegir "Guardar como PDF" con fidelidad 100% idéntica a Word
      container.documentEditor.print();
    });
  </script>
</body>
</html>

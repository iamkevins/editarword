<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Editor Word Pro & Convertidor a PDF</title>

  <!-- Catálogo de más de 20 tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&family=Lato:wght@400;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@500&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;600;700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&family=Rubik:wght@400;600&display=swap" rel="stylesheet">

  <!-- 1. Mammoth.js: Lector de archivos .docx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- 2. html2pdf.js: Convertidor a PDF en alta resolución -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Barra de control superior -->
  <header class="top-nav">
    <div class="history-controls">
      <button id="btn-undo" class="nav-btn" disabled title="Deshacer (Ctrl+Z)">
        <span class="icon">↶</span>
      </button>
      <button id="btn-redo" class="nav-btn" disabled title="Rehacer (Ctrl+Y)">
        <span class="icon">↷</span>
      </button>
      <button id="btn-quick-delete" class="nav-btn btn-x-delete" disabled title="Eliminar cuadro flotante">
        <span class="icon">✕</span>
      </button>
      <button id="btn-edit-floating" class="nav-btn btn-edit-nav" disabled title="Modificar texto flotante">
        <span class="icon">✏️</span>
      </button>
    </div>
    
    <div class="status-container">
      <span id="layer-badge" class="layer-badge" style="display: none;">Capa --</span>
      <span id="status-badge" class="status-badge">Sin documento Word</span>
    </div>
  </header>

  <!-- Espacio de trabajo infinito con zoom táctil -->
  <main id="viewport">
    <div id="empty-state">
      <div style="font-size: 48px; margin-bottom: 8px;">📝</div>
      <div style="font-size: 18px; font-weight: 700; color: #f8fafc;">Ningún archivo Word abierto</div>
      <div style="font-size: 14px; color: #94a3b8; margin-top: 6px;">Toca en <b>"Herramientas"</b> para abrir un archivo <b>.docx</b></div>
    </div>

    <!-- Hoja A4 del Documento Word -->
    <div id="sheet-wrapper">
      <!-- Capa de grilla milimétrica -->
      <div id="grid-overlay" class="grid-overlay"></div>
      
      <!-- Contenedor del texto editable del Word -->
      <div id="doc-content" class="doc-content" contenteditable="false" spellcheck="false"></div>

      <!-- Capa de elementos flotantes (firmas, cuadros, sellos) -->
      <div id="floating-layer" class="floating-layer"></div>
    </div>
  </main>

  <!-- CONTROLES DE PRECISIÓN FLOTANTES: CRUCETA Y GRILLA -->
  <div id="precision-tools" class="precision-tools">
    <button id="btn-toggle-grid" class="grid-toggle-btn" title="Mostrar/Ocultar Grilla">
      <span class="grid-icon">⊞</span>
      <span class="grid-text">Grilla</span>
    </button>

    <div class="dpad-cross">
      <button class="dpad-btn up" id="dpad-up" title="Mover 1px arriba">▲</button>
      <button class="dpad-btn left" id="dpad-left" title="Mover 1px izquierda">◀</button>
      <div class="dpad-center">1px</div>
      <button class="dpad-btn right" id="dpad-right" title="Mover 1px derecha">▶</button>
      <button class="dpad-btn down" id="dpad-down" title="Mover 1px abajo">▼</button>
    </div>
  </div>

  <!-- Modal para crear / editar textos flotantes con tipografía -->
  <div id="inline-editor-card" class="inline-editor-card">
    <div class="editor-header">
      <span id="editor-title">🔤 Cuadro de Texto Flotante</span>
      <button id="close-inline-editor" class="btn-icon">✕</button>
    </div>

    <div class="font-toolbar">
      <select id="font-family-select" class="font-select">
        <optgroup label="Sans-Serif / Modernas">
          <option value="Arial" style="font-family: Arial;">Arial / Helvetica</option>
          <option value="Roboto" style="font-family: 'Roboto';">Roboto</option>
          <option value="Open Sans" style="font-family: 'Open Sans';">Open Sans</option>
          <option value="Montserrat" style="font-family: 'Montserrat';">Montserrat</option>
          <option value="Poppins" style="font-family: 'Poppins';">Poppins</option>
          <option value="Inter" style="font-family: 'Inter';">Inter</option>
          <option value="Lato" style="font-family: 'Lato';">Lato</option>
          <option value="Raleway" style="font-family: 'Raleway';">Raleway</option>
          <option value="Nunito" style="font-family: 'Nunito';">Nunito</option>
          <option value="Verdana" style="font-family: Verdana;">Verdana</option>
        </optgroup>
        <optgroup label="Serif / Clásicas / Elegantes">
          <option value="Times New Roman" style="font-family: 'Times New Roman';">Times New Roman</option>
          <option value="Georgia" style="font-family: Georgia;">Georgia</option>
          <option value="EB Garamond" style="font-family: 'EB Garamond';">Garamond</option>
          <option value="Playfair Display" style="font-family: 'Playfair Display';">Playfair Display</option>
          <option value="Merriweather" style="font-family: 'Merriweather';">Merriweather</option>
        </optgroup>
        <optgroup label="Monoespaciadas">
          <option value="Courier New" style="font-family: 'Courier New';">Courier New</option>
          <option value="Consolas" style="font-family: Consolas;">Consolas</option>
        </optgroup>
        <optgroup label="Manuscritas / Llamativas">
          <option value="Pacifico" style="font-family: 'Pacifico';">Pacifico</option>
          <option value="Dancing Script" style="font-family: 'Dancing Script';">Dancing Script</option>
          <option value="Caveat" style="font-family: 'Caveat';">Caveat</option>
          <option value="Impact" style="font-family: Impact;">Impact</option>
        </optgroup>
      </select>

      <div class="font-styles">
        <button id="btn-toggle-bold" class="style-toggle" type="button"><b>B</b></button>
        <button id="btn-toggle-italic" class="style-toggle" type="button"><i>I</i></button>
      </div>

      <div class="font-size-ctrl">
        <button id="btn-size-dec" class="size-btn" type="button">-</button>
        <input type="number" id="font-size-input" class="size-input" min="8" max="72" value="16">
        <button id="btn-size-inc" class="size-btn" type="button">+</button>
      </div>

      <input type="color" id="font-color-picker" class="color-picker" value="#000000" title="Color de texto">
    </div>

    <textarea id="inline-editor-input" rows="3" placeholder="Escribe el texto aquí..."></textarea>

    <div class="editor-actions">
      <button id="btn-center-floating" class="btn-action secondary">🎯 Centrar</button>
      <button id="btn-apply-floating" class="btn-action primary">Aplicar</button>
    </div>
  </div>

  <!-- Botón flotante de herramientas -->
  <button class="fab-main-trigger" id="open-tools-btn">
    <span>🛠️</span>
    <span>Herramientas</span>
  </button>

  <!-- Panel desplegable inferior -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <div class="tools-panel">
      <div class="panel-header">
        <span class="panel-title">Opciones de Edición Word</span>
        <button class="panel-close" id="close-tools-btn">✕</button>
      </div>

      <div class="tools-grid">
        <!-- 1. Alternar modo edición directa -->
        <button class="tool-btn highlight disabled-tool" id="btn-toggle-doc-edit">
          <span class="icon">✏️</span>
          <span>Editar Documento</span>
        </button>

        <!-- 2. Añadir texto flotante con cruceta -->
        <button class="tool-btn disabled-tool" id="btn-add-floating-text">
          <span class="icon">🔤</span>
          <span>Cuadro de Texto</span>
        </button>

        <!-- 3. Insertar firma / imagen PNG -->
        <label class="tool-btn disabled-tool" for="img-input" style="cursor:pointer;">
          <span class="icon">🖼️</span>
          <span>Firma o Imagen</span>
        </label>
        <input type="file" id="img-input" accept="image/png, image/jpeg" style="display:none;">

        <!-- 4. Abrir archivo Word -->
        <label class="tool-btn" for="docx-input" style="cursor:pointer;">
          <span class="icon">📁</span>
          <span>Abrir .docx</span>
        </label>
        <input type="file" id="docx-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;">

        <!-- 5. Centrar visualmente -->
        <button class="tool-btn disabled-tool" id="btn-reset-zoom">
          <span class="icon">🎯</span>
          <span>Centrar Vista</span>
        </button>

        <!-- 6. CONVERTIR Y DESCARGAR A PDF -->
        <button class="tool-btn danger disabled-tool" id="btn-export-pdf" style="background: #dc2626;">
          <span class="icon">📄</span>
          <span>Convertir a PDF</span>
        </button>

        <!-- 7. DESCARGAR COMO WORD -->
        <button class="tool-btn success disabled-tool" id="btn-export-docx">
          <span class="icon">💾</span>
          <span>Descargar Word</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>

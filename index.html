<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Word Móvil Web</title>

  <!-- Motor confiable para procesar .docx en el cliente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    :root {
      --word-blue: #185abd;
      --word-blue-light: #e8f0fe;
      --bg-mobile: #f0f2f5;
      --border-gray: #dcdcdc;
      --text-main: #242424;
      --ribbon-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Calibri", "Aptos", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-mobile);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* 1. BARRA SUPERIOR ESTILO WORD ANDROID */
    .word-header {
      background-color: #ffffff;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-bottom: 1px solid var(--border-gray);
      z-index: 100;
      flex-shrink: 0;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .doc-badge {
      display: flex;
      flex-direction: column;
      margin-left: 6px;
    }

    .doc-name {
      font-size: 15px;
      font-weight: 600;
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .doc-status {
      font-size: 11px;
      color: #107c41;
      font-weight: 500;
    }

    .btn-header {
      background: transparent;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: #5f6368;
      cursor: pointer;
    }

    .btn-header:active {
      background-color: #f1f3f4;
    }

    .btn-header.active {
      color: var(--word-blue);
      background-color: var(--word-blue-light);
    }

    /* 2. ÁREA DEL DOCUMENTO (CON ESPACIO ANTI-TECLADO) */
    .document-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      justify-content: center;
      padding: 16px 12px 320px 12px; /* 320px para que el teclado nunca tape lo que escribes */
      scroll-behavior: smooth;
    }

    /* Modo Móvil: adaptable a cualquier teléfono */
    .editor-page {
      width: 100%;
      max-width: 680px;
      background: transparent;
      outline: none;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
      min-height: 40vh;
    }

    /* Modo Impresión: Página A4 con sombra */
    .document-viewport.print-mode .editor-page {
      background: #ffffff;
      padding: 28px 22px;
      border: 1px solid var(--border-gray);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      border-radius: 2px;
    }

    /* Estilos visuales de Word para títulos, tablas e imágenes */
    .editor-page h1 {
      color: #1f4e79;
      font-size: 20pt;
      margin: 18px 0 8px 0;
      font-weight: 600;
    }

    .editor-page h2 {
      color: #2e75b6;
      font-size: 15pt;
      margin: 14px 0 6px 0;
      font-weight: 600;
    }

    .editor-page h3 {
      color: #1f4e79;
      font-size: 13pt;
      margin: 10px 0 4px 0;
      font-weight: 600;
    }

    .editor-page p {
      margin-bottom: 10px;
    }

    .editor-page table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
    }

    .editor-page th, .editor-page td {
      border: 1px solid #b4c6e7;
      padding: 8px 10px;
    }

    .editor-page th {
      background-color: #d9e1f2;
      font-weight: 600;
    }

    .editor-page img {
      max-width: 100%;
      height: auto;
      margin: 10px 0;
      border-radius: 2px;
    }

    .editor-page ul, .editor-page ol {
      padding-left: 26px;
      margin-bottom: 10px;
    }

    /* 3. BARRA RÁPIDA INFERIOR (PEGADA AL TECLADO) */
    .mobile-bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--ribbon-bg);
      border-top: 1px solid var(--border-gray);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
      z-index: 50;
      transition: bottom 0.1s ease-out;
    }

    .tool-btn {
      background: transparent;
      border: none;
      font-size: 15px;
      font-weight: 600;
      width: 40px;
      height: 40px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
    }

    .tool-btn:active {
      background: #f1f3f4;
    }

    /* 4. HOJA INFERIOR DESLIZANTE (RIBBON EXPANDIDO) */
    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.18);
      transform: translateY(100%);
      transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 60;
      max-height: 52vh;
      display: flex;
      flex-direction: column;
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-gray);
    }

    .sheet-tabs {
      display: flex;
      gap: 16px;
    }

    .tab-item {
      font-size: 14px;
      font-weight: 700;
      color: #5f6368;
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--word-blue);
      border-bottom: 2px solid var(--word-blue);
      padding-bottom: 2px;
    }

    .sheet-content {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-select {
      border: 1px solid var(--border-gray);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      background: white;
      outline: none;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    /* Fondo oscuro para cerrar menús */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
      z-index: 55;
      display: none;
    }

    .scrim.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Input nativo de archivos vinculado de forma segura con label -->
  <input 
    type="file" 
    id="nativeDocxPicker" 
    accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" 
    style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" 
    onchange="handleNativeFile(event)"
  >

  <!-- Encabezado estilo Word Android -->
  <header class="word-header">
    <div class="header-left">
      <button class="btn-header">←</button>
      <div class="doc-badge">
        <span class="doc-name" id="docTitle">Documento</span>
        <span class="doc-status" id="docStatus">Guardado</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Selector de vista -->
      <button class="btn-header active" id="viewBtn" onclick="togglePageView()" title="Vista Móvil">📱</button>
      <button class="btn-header" onclick="document.execCommand('undo')" title="Deshacer">↩</button>
      <button class="btn-header" onclick="document.execCommand('redo')" title="Rehacer">↪</button>
      
      <!-- Label nativo para abrir archivos sin bloqueos en Android -->
      <label for="nativeDocxPicker" class="btn-header" title="Abrir archivo Word">📂</label>
      <button class="btn-header" onclick="exportWord()" title="Guardar">💾</button>
    </div>
  </header>

  <!-- Lienzo editable con seguimiento de cursor -->
  <main class="document-viewport" id="viewport">
    <div 
      id="editor" 
      class="editor-page" 
      contenteditable="true" 
      spellcheck="true"
    >
      <h1>Documento de Word</h1>
      <p>Toca el icono <strong>📂</strong> en la barra superior para abrir cualquier archivo <strong>.docx</strong> de tu teléfono.</p>
      <p>Escribe con libertad: el texto se mantendrá visible automáticamente sobre el teclado sin saltar ni desaparecer.</p>
    </div>
  </main>

  <!-- Barra inferior rápida -->
  <nav class="mobile-bottom-bar" id="bottomBar">
    <button class="tool-btn" onclick="execCmd('bold')"><b>N</b></button>
    <button class="tool-btn" onclick="execCmd('italic')"><i>K</i></button>
    <button class="tool-btn" onclick="execCmd('underline')"><u>S</u></button>
    <button class="tool-btn" onclick="execCmd('foreColor', '#c00000')" style="color:#c00000;">A</button>
    <button class="tool-btn" onclick="execCmd('hiliteColor', '#fff2cc')">🖍️</button>
    <button class="tool-btn" onclick="execCmd('insertUnorderedList')">•</button>
    <button class="tool-btn" onclick="toggleSheet()" style="color:var(--word-blue);">▲</button>
  </nav>

  <!-- Cortina de fondo -->
  <div class="scrim" id="scrim" onclick="toggleSheet()"></div>

  <!-- Ribbon deslizable inferior -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-nav">
      <div class="sheet-tabs">
        <span class="tab-item active" id="tabInicio" onclick="switchTab('inicio')">Inicio</span>
        <span class="tab-item" id="tabInsertar" onclick="switchTab('insertar')">Insertar</span>
      </div>
      <button class="btn-header" onclick="toggleSheet()" style="font-size:14px;">▼</button>
    </div>

    <!-- Pestaña: Inicio -->
    <div class="sheet-content" id="panelInicio">
      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Fuente</label>
        <select class="sheet-select" onchange="execCmd('fontName', this.value)">
          <option value="Calibri" selected>Calibri</option>
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Georgia">Georgia</option>
          <option value="Courier New">Courier New</option>
        </select>
      </div>

      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Tamaño</label>
        <select class="sheet-select" onchange="execCmd('fontSize', this.value)">
          <option value="2">10 pt</option>
          <option value="3" selected>11 pt</option>
          <option value="4">14 pt</option>
          <option value="5">18 pt</option>
          <option value="6">24 pt</option>
        </select>
      </div>

      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Estilo de título</label>
        <select class="sheet-select" onchange="execCmd('formatBlock', this.value)">
          <option value="<p>">Normal</option>
          <option value="<h1>">Título 1</option>
          <option value="<h2>">Título 2</option>
          <option value="<h3>">Título 3</option>
        </select>
      </div>

      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Color de texto</label>
        <div style="display:flex; gap:6px;">
          <button class="color-btn" style="background:#000000;" onclick="execCmd('foreColor', '#000000')"></button>
          <button class="color-btn" style="background:#c00000;" onclick="execCmd('foreColor', '#c00000')"></button>
          <button class="color-btn" style="background:#1f4e79;" onclick="execCmd('foreColor', '#1f4e79')"></button>
          <button class="color-btn" style="background:#2e75b6;" onclick="execCmd('foreColor', '#2e75b6')"></button>
          <button class="color-btn" style="background:#70ad47;" onclick="execCmd('foreColor', '#70ad47')"></button>
        </div>
      </div>

      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Alineación</label>
        <div>
          <button class="tool-btn" onclick="execCmd('justifyLeft')">Izq</button>
          <button class="tool-btn" onclick="execCmd('justifyCenter')">Cen</button>
          <button class="tool-btn" onclick="execCmd('justifyRight')">Der</button>
          <button class="tool-btn" onclick="execCmd('justifyFull')">Just</button>
        </div>
      </div>
    </div>

    <!-- Pestaña: Insertar -->
    <div class="sheet-content" id="panelInsertar" style="display:none;">
      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Insertar tabla básica</label>
        <button class="sheet-select" style="cursor:pointer;" onclick="insertTable()">+ Tabla (3x3)</button>
      </div>
      <div class="sheet-row">
        <label style="font-size:14px; color:#5f6368;">Línea horizontal</label>
        <button class="sheet-select" style="cursor:pointer;" onclick="execCmd('insertHorizontalRule')">Insertar</button>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const viewport = document.getElementById('viewport');
    const bottomBar = document.getElementById('bottomBar');
    const bottomSheet = document.getElementById('bottomSheet');
    const scrim = document.getElementById('scrim');
    const viewBtn = document.getElementById('viewBtn');
    const docTitle = document.getElementById('docTitle');
    const docStatus = document.getElementById('docStatus');

    // 1. SOLUCIÓN ANTI-SALTO DE PANTALLA EN MÓVILES
    // Sincroniza la barra inferior y evita que la pantalla se desplace hacia arriba al escribir
    function handleViewport() {
      if (window.visualViewport) {
        const vp = window.visualViewport;
        const offsetBottom = window.innerHeight - vp.height - vp.offsetTop;
        const cleanOffset = Math.max(0, offsetBottom);
        bottomBar.style.bottom = `${cleanOffset}px`;
        bottomSheet.style.bottom = `${cleanOffset}px`;
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleViewport);
      window.visualViewport.addEventListener('scroll', handleViewport);
    }

    // Mantiene visible la línea que se está escribiendo sobre el teclado
    function keepCaretInView() {
      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      if (rect.height === 0 && rect.width === 0) return;

      const vpHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const bottomLimit = vpHeight - 65;

      if (rect.bottom > bottomLimit) {
        viewport.scrollBy({ top: rect.bottom - bottomLimit + 25, behavior: 'smooth' });
      }
    }

    editor.addEventListener('input', keepCaretInView);

    function execCmd(cmd, val = null) {
      document.execCommand(cmd, false, val);
      editor.focus();
    }

    // 2. APERTURA NATIVA DEL ARCHIVO .DOCX
    function handleNativeFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      docTitle.innerText = file.name.replace(/\.docx$/i, '');
      docStatus.innerText = "Cargando...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const arrayBuffer = e.target.result;

        // Opciones de conversión para preservar imágenes incrustadas en Base64
        const options = {
          convertImage: mammoth.images.imgElement(function(image) {
            return image.read("base64").then(function(b64) {
              return { src: `data:${image.contentType};base64,${b64}` };
            });
          })
        };

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, options)
          .then(function(result) {
            editor.innerHTML = result.value || "<p></p>";
            docStatus.innerText = "Guardado local";
            viewport.scrollTo({ top: 0, behavior: 'smooth' });
          })
          .catch(function(err) {
            console.error(err);
            alert("No se pudo procesar el archivo Word: " + err.message);
            docStatus.innerText = "Error";
          });
      };

      reader.readAsArrayBuffer(file);
      // Limpia el input para permitir volver a abrir el mismo archivo si es necesario
      event.target.value = "";
    }

    // 3. CAMBIO DE VISTAS (MÓVIL / IMPRESIÓN A4)
    function togglePageView() {
      viewport.classList.toggle('print-mode');
      const isPrint = viewport.classList.contains('print-mode');
      viewBtn.classList.toggle('active', !isPrint);
      viewBtn.innerText = isPrint ? '📄' : '📱';
      viewBtn.title = isPrint ? 'Vista de Impresión' : 'Vista Móvil';
    }

    // 4. CONTROL DEL RIBBON DESLIZABLE
    function toggleSheet() {
      const isOpen = bottomSheet.classList.contains('open');
      bottomSheet.classList.toggle('open', !isOpen);
      scrim.classList.toggle('show', !isOpen);
    }

    function switchTab(tab) {
      const isInicio = tab === 'inicio';
      document.getElementById('tabInicio').classList.toggle('active', isInicio);
      document.getElementById('tabInsertar').classList.toggle('active', !isInicio);
      document.getElementById('panelInicio').style.display = isInicio ? 'flex' : 'none';
      document.getElementById('panelInsertar').style.display = !isInicio ? 'flex' : 'none';
    }

    function insertTable() {
      const tableHtml = `
        <table>
          <tr><th>Columna 1</th><th>Columna 2</th><th>Columna 3</th></tr>
          <tr><td>Dato</td><td>Dato</td><td>Dato</td></tr>
          <tr><td>Dato</td><td>Dato</td><td>Dato</td></tr>
        </table><p><br></p>
      `;
      execCmd('insertHTML', tableHtml);
      toggleSheet();
    }

    // 5. EXPORTACIÓN A ARCHIVO WORD COMPATIBLE
    function exportWord() {
      const title = docTitle.innerText || "Documento";
      const content = editor.innerHTML;
      const html = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>${title}</title></head>
        <body>${content}</body>
        </html>
      `;
      const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${title}.doc`;
      link.click();
      URL.revokeObjectURL(link.href);
    }
  </script>
</body>
</html>

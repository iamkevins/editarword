<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor Word Web</title>
  
  <!-- Estilos del motor de Word de Syncfusion -->
  <link href="https://cdn.syncfusion.com/ej2/24.2.7/material.css" rel="stylesheet">
  
  <!-- Script del motor del editor -->
  <script src="https://cdn.syncfusion.com/ej2/24.2.7/dist/ej2.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f7;
    }
    #document-editor {
      height: 100vh !important;
      width: 100vw !important;
    }
    /* Ocultar avisos flotantes de desarrollo */
    div[style*="position: fixed"][style*="z-index: 999999999"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="document-editor"></div>

  <script>
    // Inicializar el editor con la cinta de opciones completa de Word
    var container = new ej.documenteditor.DocumentEditorContainer({
      enableToolbar: true,
      height: '100%',
      // Servicio en la nube para procesar la estructura binaria de los .docx
      serviceUrl: 'https://document.syncfusion.com/web-services/docx-editor/api/documenteditor/'
    });

    // Montar el editor en pantalla
    container.appendTo('#document-editor');
  </script>
</body>
</html>
